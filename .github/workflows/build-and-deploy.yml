name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all release data from artifact-standards
        run: |
          mkdir -p src/_data/versions
          gh api repos/aaronpeikert/artifact-standards/releases \
            --paginate \
            --jq '.[].tag_name' | while read -r tag; do
            echo "Downloading ${tag}..."
            curl -fsSL \
              "https://github.com/aaronpeikert/artifact-standards/releases/download/${tag}/data.yml" \
              -o "src/_data/versions/${tag}.yaml" \
              || echo "Warning: failed to download ${tag}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
